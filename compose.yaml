services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - lms-data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lms
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: ${LMS_DB_PASSWORD:?Set LMS_DB_PASSWORD in .env}
      LMS_ADMIN_PASSWORD: ${LMS_ADMIN_PASSWORD:?Set LMS_ADMIN_PASSWORD in .env}
      LMS_TEACHER_PASSWORD: ${LMS_TEACHER_PASSWORD:?Set LMS_TEACHER_PASSWORD in .env}
      LMS_STUDENT_EMAIL: ${LMS_STUDENT_EMAIL:-student1@example.com}
      LMS_STUDENT_PASSWORD: ${LMS_STUDENT_PASSWORD:?Set LMS_STUDENT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LMS_PORT:-8080}:8080"
volumes:
  lms-data:
