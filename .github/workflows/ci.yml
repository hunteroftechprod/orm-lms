name: LMS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check Java source whitespace
        run: |
          if git grep -n -I -E '[[:blank:]]+$' -- '*.java'; then
            exit 1
          fi
      - name: Run unit and PostgreSQL integration tests
        run: mvn -B -ntp clean verify
      - name: Build container image
        run: docker build -t orm-lms:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: lms-jar
          path: target/lms-*.jar
